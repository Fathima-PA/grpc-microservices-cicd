
services:
  mongodb:
    image: mongo:7
    container_name: user-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: users_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: order-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: fathimapa123/grpc-microservices-cicd:order-service-latest
    restart: unless-stopped
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "3002"
      DATABASE_URL: postgresql://appuser:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/orders_db?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "50051:50051"
      - "3004:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network




  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: fathimapa123/grpc-microservices-cicd:user-service-latest
    restart: unless-stopped
    ports:
      - "3003:3001"
      - "50052:50052"
    environment:
      PORT: "3001"
      USER_GRPC_PORT: "50052"
      NODE_OPTIONS: --experimental-global-webcrypto
      MONGO_URI: mongodb://mongodb:27017/users_db
      ORDER_GRPC_URL: order-service:50051
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 24h
    depends_on:
      mongodb:
        condition: service_healthy
      order-service:
        condition: service_started
    networks:
      - microservices-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
    depends_on:
      - user-service
      - order-service
    networks:
      - microservices-network

volumes:
  mongo-data:
  postgres-data:

networks:
  microservices-network:
    driver: bridge
