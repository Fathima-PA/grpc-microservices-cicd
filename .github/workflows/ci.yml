
name: gRPC Microservices CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  validate:
    name: Install and Validate
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-test-secret-for-validation-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            user-service/package-lock.json
            order-service/package-lock.json

      - name: Install User Service dependencies
        working-directory: user-service
        run: npm ci

      - name: Install Order Service dependencies
        working-directory: order-service
        run: npm ci

      - name: Generate Prisma Client
        working-directory: order-service
        env:
          DATABASE_URL: postgresql://appuser:ci-only-password@localhost:5432/orders_db?schema=public
        run: npx prisma generate

      - name: Validate Docker Compose
        run: docker compose config --quiet

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: true
      matrix:
        service:
          - name: api-gateway
            context: ./api-gateway
            image: api-gateway-latest

          - name: user-service
            context: ./user-service
            image: user-service-latest

          - name: order-service
            context: ./order-service
            image: order-service-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: fathimapa123/grpc-microservices-cicd:${{ matrix.service.image }}
