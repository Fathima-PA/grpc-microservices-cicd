
name: gRPC Microservices CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Install, Validate, Build and Push
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ci-only-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            user-service/package-lock.json
            order-service/package-lock.json

      - name: Install UserService dependencies
        working-directory: user-service
        run: npm ci

      - name: Install OrderService dependencies
        working-directory: order-service
        run: npm ci

      - name: Generate Prisma Client
        working-directory: order-service
        env:
          DATABASE_URL: postgresql://appuser:ci-only-password@localhost:5432/orders_db?schema=public
        run: npx prisma generate

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push User Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          push: true
          tags: fathimapa123/grpc-microservices-cicd:user-service-latest

      - name: Build and Push Order Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          push: true
          tags: fathimapa123/grpc-microservices-cicd:order-service-latest
