name: gRPC Microservices CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Install and Validate
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-test-secret-for-validation-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            user-service/package-lock.json
            order-service/package-lock.json

      - name: Install User Service dependencies
        working-directory: user-service
        run: npm ci

      - name: Install Order Service dependencies
        working-directory: order-service
        run: npm ci

      - name: Generate Prisma Client
        working-directory: order-service
        env:
          DATABASE_URL: postgresql://appuser:ci-only-password@localhost:5432/orders_db?schema=public
        run: npx prisma generate

      - name: Validate Docker Compose
        run: docker compose config --quiet

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: true
      matrix:
        service:
          - name: api-gateway
            context: ./api-gateway
            image: api-gateway-latest

          - name: user-service
            context: ./user-service
            image: user-service-latest

          - name: order-service
            context: ./order-service
            image: order-service-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            fathimapa123/grpc-microservices-cicd:${{ matrix.service.image }}
            fathimapa123/grpc-microservices-cicd:${{ matrix.service.name }}-${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, Windows, X64]
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check Kubernetes connection
        shell: powershell
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy API Gateway
        shell: powershell
        run: |
          kubectl set image deployment/gateway gateway=fathimapa123/grpc-microservices-cicd:api-gateway-${{ github.sha }}

      - name: Deploy User Service
        shell: powershell
        run: |
          kubectl set image deployment/user-service user-service=fathimapa123/grpc-microservices-cicd:user-service-${{ github.sha }}

      - name: Deploy Order Service
        shell: powershell
        run: |
          kubectl set image deployment/order-service order-service=fathimapa123/grpc-microservices-cicd:order-service-${{ github.sha }}

      - name: Verify Kubernetes deployment
        shell: powershell
        run: |
          kubectl rollout status deployment/gateway --timeout=180s
          kubectl rollout status deployment/user-service --timeout=180s
          kubectl rollout status deployment/order-service --timeout=180s

      - name: Display deployment status
        shell: powershell
        run: |
          kubectl get deployments
          kubectl get pods

      - name: Rollback deployment
        if: failure()
        shell: powershell
        run: |
          Write-Host "Deployment failed. Starting rollback..."

          kubectl rollout undo deployment/gateway
          kubectl rollout undo deployment/user-service
          kubectl rollout undo deployment/order-service

          kubectl rollout status deployment/gateway --timeout=180s
          kubectl rollout status deployment/user-service --timeout=180s
          kubectl rollout status deployment/order-service --timeout=180s

          Write-Host "Rollback completed."
